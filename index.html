<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dce7c8" />
  <title>The Matcha Games</title>
  <meta name="description" content="Live-Punktestand für The Matcha Games – Mila vs. Chrissy" />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <style>
    :root{
      --matcha:#7f9b65;
      --matcha-dark:#526843;
      --matcha-light:#dce7c8;
      --cream:#f7f1e4;
      --paper:#fffdf8;
      --ink:#243020;
      --muted:#6d7667;
      --line:rgba(60,84,45,.16);
      --shadow:0 18px 50px rgba(53,78,39,.14);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(145deg,var(--cream),#edf3df 55%,#dbe8c8);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:22px}
    .app{width:min(980px,100%)}
    .shell{background:rgba(255,253,248,.82);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:32px;box-shadow:var(--shadow);padding:clamp(22px,4vw,42px)}
    header{text-align:center;margin-bottom:28px}
    .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--matcha-dark);font-weight:800;margin-bottom:8px}
    h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,7vw,72px);line-height:.95;font-weight:700;letter-spacing:-.04em}
    .subtitle{margin:12px 0 0;color:var(--muted);font-size:15px}
    .scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:stretch}
    .player{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,4vw,34px);min-height:310px;display:flex;flex-direction:column;justify-content:center;text-align:center}
    .player:before{content:"";position:absolute;inset:auto -45px -55px auto;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--matcha-light),transparent 70%);opacity:.95}
    .name{font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--matcha-dark);font-weight:800}
    .score{font-variant-numeric:tabular-nums;font-size:clamp(82px,18vw,150px);line-height:.9;font-weight:800;letter-spacing:-.07em;margin:26px 0 12px}
    .label{color:var(--muted);font-size:13px}
    .vs{display:flex;align-items:center;justify-content:center;color:var(--matcha-dark);font-weight:900;font-family:Georgia,"Times New Roman",serif;font-size:22px}
    .status{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:24px;color:var(--muted);font-size:13px}
    .dot{width:8px;height:8px;border-radius:50%;background:#99a096;box-shadow:0 0 0 4px rgba(127,155,101,.12)}
    .dot.live{background:#6c944d}
    .footer{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
    .pill{border:1px solid var(--line);background:rgba(255,255,255,.55);padding:9px 13px;border-radius:999px;color:var(--muted);font-size:12px}
    .error{display:none;margin:18px auto 0;max-width:680px;background:#fff5f1;color:#7a3b2d;border:1px solid #f1c7bb;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.45}
    @media (max-width:700px){
      body{padding:12px;align-items:flex-start}
      .shell{border-radius:24px;padding:20px}
      .scoreboard{grid-template-columns:1fr 1fr;gap:12px}
      .vs{display:none}
      .player{min-height:250px;border-radius:22px;padding:20px 12px}
      .score{font-size:clamp(74px,25vw,112px)}
      h1{font-size:46px}
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="shell">
      <header>
        <div class="eyebrow">Matcha Latte Championship</div>
        <h1>The Matcha Games</h1>
        <p class="subtitle">Mila vs. Chrissy · Live Score</p>
      </header>

      <div class="scoreboard" aria-live="polite">
        <article class="player">
          <div class="name">Mila</div>
          <div id="milaScore" class="score">0</div>
          <div class="label">Punkte</div>
        </article>

        <div class="vs">VS</div>

        <article class="player">
          <div class="name">Chrissy</div>
          <div id="chrissyScore" class="score">0</div>
          <div class="label">Punkte</div>
        </article>
      </div>

      <div class="status"><span id="liveDot" class="dot"></span><span id="statusText">Verbinde …</span></div>
      <div id="errorBox" class="error"></div>
      <div class="footer"><span class="pill">Live synchronisiert</span><span class="pill">Nur Ansicht</span></div>
    </section>
  </main>

  <script src="firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
    import { getFirestore, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';

    const milaEl = document.getElementById('milaScore');
    const chrissyEl = document.getElementById('chrissyScore');
    const statusText = document.getElementById('statusText');
    const liveDot = document.getElementById('liveDot');
    const errorBox = document.getElementById('errorBox');

    function showError(message){
      errorBox.textContent = message;
      errorBox.style.display = 'block';
      statusText.textContent = 'Nicht verbunden';
      liveDot.classList.remove('live');
    }

    try {
      const cfg = window.MATCHA_FIREBASE_CONFIG;
      if (!cfg || String(cfg.apiKey).includes('PASTE_')) throw new Error('Firebase ist noch nicht eingerichtet. Öffne README.md und trage deine Firebase-Konfiguration in firebase-config.js ein.');
      const app = initializeApp(cfg);
      const db = getFirestore(app);
      const scoreRef = doc(db, 'matches', 'the-matcha-games');

      onSnapshot(scoreRef, (snap) => {
        const data = snap.exists() ? snap.data() : {mila:0, chrissy:0};
        milaEl.textContent = Number(data.mila || 0);
        chrissyEl.textContent = Number(data.chrissy || 0);
        statusText.textContent = 'Live';
        liveDot.classList.add('live');
      }, (err) => showError('Fehler beim Laden des Live-Stands: ' + err.message));
    } catch (err) {
      showError(err.message);
    }
  </script>
</body>
</html>
