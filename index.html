.name{position:relative;z-index:1;font-size:clamp(17px,2.6vw,23px);letter-spacing:.115em;text-transform:uppercase;color:var(--matcha-dark);font-weight:800;}
.score{position:relative;z-index:1;font-family:"Bodoni 72","Didot","Bodoni MT",Georgia,"Times New Roman",serif;font-variant-numeric:tabular-nums;font-size:clamp(106px,21vw,168px);line-height:.82;font-weight:500;letter-spacing:-.06em;margin:38px 0 20px;color:#102b1a;text-shadow:0 .4px 0 rgba(0,0,0,.06);}

.live-dot.off{background:#aaa99f;box-shadow:0 0 0 7px rgba(120,120,110,.08);}
.error{display:none;position:relative;z-index:6;margin:12px auto 0;max-width:590px;padding:12px 14px;border:1px solid rgba(149,81,63,.3);border-radius:14px;background:rgba(255,246,241,.76);color:#7f4333;font-size:13px;line-height:1.4;text-align:center;}

 .header-art-wrap{width:min(430px,112%);margin-left:-6%;margin-right:-6%;margin-bottom:-6px;}
 .scoreboard{gap:10px;}
 .player{min-height:258px;padding:27px 8px 22px;border-radius:23px;}
 .name{font-size:15px;letter-spacing:.09em;}
 .score{font-size:clamp(92px,29vw,124px);margin:27px 0 15px;}
 .label{font-size:16px;}
 .live-row{margin-top:31px;font-size:18px;}
 .live-dot{width:14px;height:14px;}
 .leaf-art{width:255px;left:-68px;bottom:-8px;opacity:.90;}
}
@media(max-width:370px){.player{min-height:238px}.score{font-size:88px}.header-art-wrap{width:116%;margin-left:-8%}}

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';

const milaEl=document.getElementById('milaScore'),chrissyEl=document.getElementById('chrissyScore'),statusText=document.getElementById('statusText'),liveDot=document.getElementById('liveDot'),errorBox=document.getElementById('errorBox');
function showError(message){errorBox.textContent=message;errorBox.style.display='block';statusText.textContent='Nicht verbunden';liveDot.classList.add('off')}
try{const cfg=window.MATCHA_FIREBASE_CONFIG;if(!cfg||String(cfg.apiKey).includes('PASTE_'))throw new Error('Firebase ist noch nicht eingerichtet.');const app=initializeApp(cfg),db=getFirestore(app),scoreRef=doc(db,'matches','the-matcha-games');onSnapshot(scoreRef,snap=>{const d=snap.exists()?snap.data():{mila:0,chrissy:0};milaEl.textContent=Number(d.mila||0);chrissyEl.textContent=Number(d.chrissy||0);statusText.textContent='Live';liveDot.classList.remove('off')},err=>showError('Fehler beim Laden des Live-Stands: '+err.message))}catch(err){showError(err.message)}
