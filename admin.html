<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dce7c8" />
  <title>The Matcha Games · Admin</title>
  <style>
    :root{--matcha:#7f9b65;--matcha-dark:#4f653f;--matcha-light:#dce7c8;--cream:#f7f1e4;--paper:#fffdf8;--ink:#243020;--muted:#6d7667;--line:rgba(60,84,45,.16);--danger:#a34d3b;--shadow:0 18px 50px rgba(53,78,39,.14)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(145deg,var(--cream),#edf3df 55%,#dbe8c8);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:20px}
    button,input{font:inherit}
    .app{width:min(980px,100%)}
    .shell{background:rgba(255,253,248,.84);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:32px;box-shadow:var(--shadow);padding:clamp(20px,4vw,40px)}
    header{text-align:center;margin-bottom:24px}
    .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--matcha-dark);font-weight:800;margin-bottom:8px}
    h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,7vw,68px);line-height:.95;letter-spacing:-.04em}
    .subtitle{margin:11px 0 0;color:var(--muted);font-size:14px}
    .login{max-width:430px;margin:0 auto;display:grid;gap:12px}
    .login input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 15px;outline:none}
    .login input:focus{border-color:var(--matcha)}
    .primary{border:0;border-radius:14px;padding:14px 16px;background:var(--matcha-dark);color:#fff;font-weight:800;cursor:pointer}
    .board{display:none}
    .scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .player{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:26px;text-align:center}
    .name{font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--matcha-dark);font-weight:800}
    .score{font-variant-numeric:tabular-nums;font-size:clamp(76px,14vw,128px);line-height:.9;font-weight:850;letter-spacing:-.07em;margin:22px 0 20px}
    .controls{display:grid;grid-template-columns:1fr 2fr;gap:10px}
    .btn{border:1px solid var(--line);border-radius:16px;padding:17px 14px;font-weight:850;cursor:pointer;touch-action:manipulation}
    .minus{background:#fff;color:var(--ink)}
    .plus{background:var(--matcha);color:#fff;border-color:transparent;font-size:18px}
    .btn:active{transform:scale(.985)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
    .status{color:var(--muted);font-size:13px}
    .link{border:0;background:transparent;color:var(--matcha-dark);font-weight:750;cursor:pointer;padding:10px}
    .reset{border:1px solid rgba(163,77,59,.25);background:#fff7f4;color:var(--danger);border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}
    .msg{margin-top:14px;min-height:20px;text-align:center;color:var(--muted);font-size:13px}
    @media(max-width:650px){body{padding:10px;align-items:flex-start}.shell{border-radius:24px;padding:18px}.scoreboard{gap:10px}.player{border-radius:20px;padding:20px 10px}.score{font-size:clamp(70px,25vw,108px)}.controls{grid-template-columns:1fr}.btn{padding:15px 10px}.plus{order:-1}h1{font-size:44px}}
  </style>
</head>
<body>
  <main class="app">
    <section class="shell">
      <header>
        <div class="eyebrow">Master Control</div>
        <h1>The Matcha Games</h1>
        <p class="subtitle">Admin · Mila vs. Chrissy</p>
      </header>

      <section id="loginPanel" class="login">
        <input id="email" type="email" autocomplete="username" placeholder="Admin-E-Mail" />
        <input id="password" type="password" autocomplete="current-password" placeholder="Passwort" />
        <button id="loginBtn" class="primary">Admin anmelden</button>
      </section>

      <section id="board" class="board">
        <div class="scoreboard">
          <article class="player">
            <div class="name">Mila</div>
            <div id="milaScore" class="score">0</div>
            <div class="controls">
              <button class="btn minus" data-player="mila" data-delta="-1">−1</button>
              <button class="btn plus" data-player="mila" data-delta="1">+1 Mila</button>
            </div>
          </article>
          <article class="player">
            <div class="name">Chrissy</div>
            <div id="chrissyScore" class="score">0</div>
            <div class="controls">
              <button class="btn minus" data-player="chrissy" data-delta="-1">−1</button>
              <button class="btn plus" data-player="chrissy" data-delta="1">+1 Chrissy</button>
            </div>
          </article>
        </div>

        <div class="toolbar">
          <div class="status" id="statusText">Live synchronisiert</div>
          <div>
            <button id="logoutBtn" class="link">Abmelden</button>
            <button id="resetBtn" class="reset">Stand zurücksetzen</button>
          </div>
        </div>
      </section>
      <div id="msg" class="msg"></div>
    </section>
  </main>

  <script src="firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';
    import { getFirestore, doc, onSnapshot, runTransaction, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';

    const cfg = window.MATCHA_FIREBASE_CONFIG;
    const msg = document.getElementById('msg');
    const loginPanel = document.getElementById('loginPanel');
    const board = document.getElementById('board');
    const milaEl = document.getElementById('milaScore');
    const chrissyEl = document.getElementById('chrissyScore');

    function say(text, isError=false){msg.textContent=text;msg.style.color=isError?'#a34d3b':'#6d7667'}
    if (!cfg || String(cfg.apiKey).includes('PASTE_')) say('Firebase ist noch nicht eingerichtet. Siehe README.md.', true);

    const app = initializeApp(cfg);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const scoreRef = doc(db, 'matches', 'the-matcha-games');

    document.getElementById('loginBtn').addEventListener('click', async()=>{
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try{ await signInWithEmailAndPassword(auth,email,password); say(''); }
      catch(e){ say('Login fehlgeschlagen: '+e.message,true); }
    });

    document.getElementById('logoutBtn').addEventListener('click', ()=>signOut(auth));

    onAuthStateChanged(auth, user=>{
      loginPanel.style.display = user ? 'none' : 'grid';
      board.style.display = user ? 'block' : 'none';
      if(user) say('Angemeldet als '+user.email);
    });

    onSnapshot(scoreRef, snap=>{
      const d=snap.exists()?snap.data():{mila:0,chrissy:0};
      milaEl.textContent=Number(d.mila||0);
      chrissyEl.textContent=Number(d.chrissy||0);
    }, e=>say('Live-Verbindung fehlgeschlagen: '+e.message,true));

    async function changeScore(player, delta){
      if(!auth.currentUser) return say('Bitte zuerst anmelden.',true);
      try{
        await runTransaction(db, async tx=>{
          const snap=await tx.get(scoreRef);
          const current=snap.exists()?Number(snap.data()[player]||0):0;
          const next=Math.max(0,current+delta);
          const base=snap.exists()?snap.data():{mila:0,chrissy:0};
          tx.set(scoreRef,{...base,[player]:next,updatedAt:serverTimestamp()},{merge:true});
        });
        if(navigator.vibrate) navigator.vibrate(18);
      }catch(e){say('Punkt konnte nicht gespeichert werden: '+e.message,true)}
    }

    document.querySelectorAll('[data-player]').forEach(btn=>btn.addEventListener('click',()=>changeScore(btn.dataset.player,Number(btn.dataset.delta))));

    document.getElementById('resetBtn').addEventListener('click', async()=>{
      if(!auth.currentUser) return;
      if(!confirm('Wirklich beide Punktestände auf 0 setzen?')) return;
      try{await setDoc(scoreRef,{mila:0,chrissy:0,updatedAt:serverTimestamp()},{merge:true});say('Punktestand zurückgesetzt.');}
      catch(e){say('Reset fehlgeschlagen: '+e.message,true)}
    });
  </script>
</body>
</html>
